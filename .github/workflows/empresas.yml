name: Empresas (lista para a busca)
# out/2026: monta dados/empresas.json com os nomes das empresas, FIIs, Fiagros e ETFs da B3
# (a partir da base de proventos deste repositório) e dos EUA (lista oficial da SEC, só o
# que é listado em bolsa). A busca inteligente do G20 Hub lê esse arquivo para reconhecer
# ativos pelo nome, mesmo fora da carteira do aluno. Sem Vercel e sem chave.
# Roda sozinha aos domingos às 20h (Brasília) e também pelo botão "Run workflow".
on:
  schedule:
    - cron: '0 23 * * 0'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  empresas:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Montar a lista de empresas
        run: python3 scripts/empresas.py
      - name: Gravar no repositório (só se mudou)
        id: gravar
        run: |
          git config user.name "G20 Empresas"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/empresas.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
            echo "Nada novo para gravar."
          else
            git commit -q -m "Empresas: $(date -u -d '-3 hours' +%Y-%m-%d)"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi
      # Envio feito por esta tarefa não dispara o deploy normal: publica aqui mesmo
      - if: steps.gravar.outputs.mudou == 'sim'
        uses: actions/configure-pages@v6
      - if: steps.gravar.outputs.mudou == 'sim'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - if: steps.gravar.outputs.mudou == 'sim'
        id: deployment
        uses: actions/deploy-pages@v5
