name: Proventos BR - base historica
# out/2026: monta em dados/proventos/br/ a base de proventos e eventos (desdobramentos,
# grupamentos, bonificações) de ações e FIIs do Brasil, um arquivo por ativo, lida pela
# Minha Carteira e pela Carteira G20. Script: scripts/proventos_br.mjs.
# Roda sozinha de segunda a sexta às 21h (Brasília) no modo atualizar, e também pelo botão
# "Run workflow" na aba Actions, escolhendo o modo:
#   atualizar = rotina diária gratuita: últimos 12 meses pela B3 + ativos que estrearam na bolsa
#   teste     = poucos ativos de exemplo, para conferir mudanças no script
#   acoes     = carga completa de todas as ações listadas (BRAPI_TOKEN para datas antigas)
#   fiis      = carga completa de FIIs, Fiagros e FI-Infra negociados
#   diagnostico = não grava nada; mostra no log o que as fontes devolvem para os ativos do campo
# Comandos especiais no campo de ativos (modo fiis): REFAZER (refaz fundos com repetidos ou
# falhas) e LIMPAR (remove rendimentos repetidos idênticos sem baixar nada).
# Para no limite de ~5h20 e grava o que fez; rodar de novo continua de onde parou.
on:
  schedule:
    - cron: '0 0 * * 2-6'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo'
        type: choice
        options: [atualizar, teste, acoes, fiis, diagnostico]
        default: atualizar
      tickers:
        description: 'Só estes ativos (opcional, separados por vírgula)'
        required: false
        default: ''
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  carga:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    # uma execução por vez (carga e rotina diária gravam os mesmos arquivos de controle)
    concurrency:
      group: proventos-br
      cancel-in-progress: false
    outputs:
      mudou: ${{ steps.gravar.outputs.mudou }}
    steps:
      - uses: actions/checkout@v7
      - name: Montar a base
        env:
          MODO: ${{ inputs.modo || 'atualizar' }}
          TICKERS: ${{ inputs.tickers }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          HORAS: '5.3'
        run: node scripts/proventos_br.mjs
      - name: Gravar no repositório (só se mudou)
        id: gravar
        if: always()
        run: |
          git config user.name "G20 Proventos BR"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/proventos/br 2>/dev/null || true
          git add dados/proventos/auditoria 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
            echo "Nada novo para gravar."
          else
            git commit -m "Proventos BR (${{ inputs.modo || 'atualizar' }}): $(date -u -d '-3 hours' +%Y-%m-%d)"
            for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi
  # Envio feito por esta tarefa não dispara o deploy normal: publica aqui, na fila do Pages
  publicar:
    needs: carga
    if: needs.carga.outputs.mudou == 'sim'
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
