name: Investigação (cópia cifrada)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund firebase-admin@13.0.0
      - name: Copiar cifrado
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/inv/dump.mjs
      - name: Guardar
        run: |
          git config user.name "robo-g20"; git config user.email "robo-g20@users.noreply.github.com"
          git add dados/inv/dump.bin; git commit -m "Investigação: cópia cifrada" -q; git pull --rebase -q origin main && git push -q origin HEAD:main
