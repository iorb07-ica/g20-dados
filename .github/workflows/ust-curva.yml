name: Curva do Tesouro americano
# 28/10/2026: grava em dados/ust/ a curva oficial do Tesouro dos EUA (par yield),
# usada pela Minha Carteira para marcar Treasury e bonds a mercado (Renda Fixa no exterior).
# Roda sozinho em dias úteis (horário de Brasília: 20h30 e 09h30) e também pelo botão
# "Run workflow" na aba Actions. Só grava e publica se a curva mudou.
on:
  schedule:
    - cron: '30 23 * * 1-5'
    - cron: '30 12 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  curva:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar a curva oficial
        run: python scripts/ust_curva.py
      - name: Gravar no repositório (só se mudou)
        id: gravar
        run: |
          git config user.name "G20 Curva do Tesouro americano"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/ust
          if git diff --cached --quiet; then
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
            echo "Curva igual à já gravada."
          else
            git commit -m "Curva do Tesouro americano: $(python -c "import json;print(json.load(open('dados/ust/hoje.json'))['base'])")"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi
      # Envio feito por esta tarefa não dispara o deploy normal: publica aqui mesmo
      - if: steps.gravar.outputs.mudou == 'sim'
        uses: actions/configure-pages@v4
      - if: steps.gravar.outputs.mudou == 'sim'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - if: steps.gravar.outputs.mudou == 'sim'
        id: deployment
        uses: actions/deploy-pages@v4
