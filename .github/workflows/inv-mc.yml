name: Investigação (Minha Carteira, cifrado)
on:
  workflow_dispatch:
    inputs:
      teste_url:
        required: true
permissions:
  contents: write
jobs:
  mc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund firebase-admin@13.0.0
      - name: Rodar
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TESTE_URL: ${{ inputs.teste_url }}
        run: node scripts/inv/mc.mjs
      - name: Guardar
        run: |
          git config user.name "robo-g20"; git config user.email "robo-g20@users.noreply.github.com"
          git add dados/inv/mc.bin; git commit -m "Investigação: Minha Carteira (cifrado)" -q; git pull --rebase -q origin main && git push -q origin HEAD:main
