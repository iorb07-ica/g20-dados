name: Bonificações B3 - custo atribuído
# out/2026: monta dados/proventos/bonificacoes.json com as bonificações em ações das empresas
# da B3 e o custo atribuído de cada uma, lido dos fatos relevantes e avisos aos acionistas
# (dados abertos da CVM). A Minha Carteira usa para lançar a bonificação sozinha para o aluno.
# Script: scripts/bonificacoes_custos.py.
# Roda sozinha toda segunda às 22h (Brasília) no modo atualizar (ano atual e anterior), e
# também pelo botão "Run workflow" na aba Actions, escolhendo o modo:
#   atualizar   = rotina semanal
#   completo    = carga desde 2016 (a primeira vez); pode levar algumas horas e, se parar
#                 no limite de tempo, rodar de novo continua de onde parou
#   diagnostico = não grava nada; mostra no log o que leria de 15 documentos
on:
  schedule:
    - cron: '0 1 * * 2'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo'
        type: choice
        options: [atualizar, completo, diagnostico]
        default: diagnostico
      ano_inicio:
        description: 'Ano inicial (modo completo)'
        required: false
        default: '2016'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  carga:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    concurrency:
      group: bonificacoes
      cancel-in-progress: false
    outputs:
      mudou: ${{ steps.gravar.outputs.mudou }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar leitor de PDF
        run: pip install pypdf==4.3.1
      - name: Montar a base
        env:
          MODO: ${{ inputs.modo || 'atualizar' }}
          ANO_INICIO: ${{ inputs.ano_inicio || '2016' }}
          MINUTOS: '300'
        run: python scripts/bonificacoes_custos.py
      - name: Gravar no repositório (só se mudou)
        id: gravar
        if: always()
        run: |
          git config user.name "G20 Bonificações"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/proventos/bonificacoes.json dados/proventos/bonificacoes-estado.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
            echo "Nada novo para gravar."
          else
            git commit -m "Bonificações (${{ inputs.modo || 'atualizar' }}): $(date -u -d '-3 hours' +%Y-%m-%d)"
            for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi
  publicar:
    needs: carga
    if: needs.carga.outputs.mudou == 'sim'
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
